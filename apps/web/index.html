<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta
      name="description"
      content="Alerta temprana comunitaria de incidentes urbanos en La Paz y El Alto"
    />
    <!-- La primera tesela del mapa suele ser el LCP: la conexión se abre antes de pedirla. -->
    <link rel="preconnect" href="https://tile.openstreetmap.org" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- iOS 16.4 o superior: con la app agregada a inicio se abre sin barra y recibe avisos. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Alerta LP" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Alerta La Paz y El Alto</title>
  </head>
  <body>
    <div id="root">
      <!-- Esqueleto estático: se pinta antes de que cargue el JS y React lo reemplaza al montar. -->
      <div class="app" aria-hidden="true">
        <header class="encabezado">
          <div class="encabezado__fila">
            <div>
              <p class="encabezado__nombre">Alerta LP</p>
              <p class="encabezado__lugar">La Paz · El Alto</p>
            </div>
          </div>
          <div class="red">
            <span class="red__linea" style="--linea: var(--linea-amarilla)"></span>
            <span class="red__linea" style="--linea: var(--linea-roja)"></span>
            <span class="red__linea" style="--linea: var(--linea-morada)"></span>
            <span class="red__linea" style="--linea: var(--linea-cafe)"></span>
            <span class="red__linea" style="--linea: var(--linea-naranja)"></span>
          </div>
        </header>
        <main class="app__cuerpo">
          <div class="mapa"><div class="mapa__lienzo"></div></div>
        </main>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

packages:
  - 'apps/*'
  - 'packages/*'
  - 'packages/modules/*'

# Scripts de instalación permitidos. esbuild descarga su binario; el resto no se necesita.
allowBuilds:
  esbuild: true
  cpu-features: false
  protobufjs: false
  ssh2: false

# Parches de seguridad en dependencias de desarrollo (Fase 11, RNF-13; ver docs/seguridad/owasp-top-10.md).
# Las usa Lighthouse CI (@lhci/cli), que solo corre en la CI y nunca llega a producción.
overrides:
  tmp@<0.2.6: ^0.2.6
  basic-ftp@<6.2.1: ^6.2.1
  # GHSA de undici (DoS por content-encodings excesivos, 2026-10). Solo lo usan jsdom y Testcontainers,
  # en las pruebas, pero entra por @gis/testing, que es una dependencia de producción del monorepo.
  undici@>=8.0.0 <8.12.2: ^8.12.2

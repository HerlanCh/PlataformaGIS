services:
  db:
    image: postgis/postgis:18-3.6
    environment:
      POSTGRES_USER: gis
      POSTGRES_PASSWORD: gis
      POSTGRES_DB: gis
    ports:
      # Puerto 5433 en el anfitrión: evita chocar con un PostgreSQL instalado en la máquina.
      - '5433:5432'
    volumes:
      # Desde PostgreSQL 18 la imagen guarda los datos bajo /var/lib/postgresql.
      - gis-db:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gis -d gis']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  gis-db:

services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_USER: gis
      POSTGRES_PASSWORD: gis
      POSTGRES_DB: gis
    ports:
      - '5432:5432'
    volumes:
      - gis-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gis -d gis']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  gis-db:

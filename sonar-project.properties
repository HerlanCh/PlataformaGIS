# Ajustar projectKey y organization a los valores que muestre SonarCloud al importar el repositorio.
sonar.projectKey=HerlanCh_PlataformaGIS
sonar.organization=herlanch

sonar.sources=apps,packages
sonar.tests=apps,packages,tools/architecture
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/tests/**
sonar.exclusions=**/dist/**,**/coverage/**,**/*.generated.ts,tools/architecture/fixtures/**
sonar.coverage.exclusions=**/*.test.ts,**/*.test.tsx,**/tests/**,**/*.config.ts,**/src/main.ts,**/src/main.tsx
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# La compuerta de calidad bloquea el pipeline si no se supera.
sonar.qualitygate.wait=true

# Ajustar projectKey y organization a los valores que muestre SonarCloud al importar el repositorio.
sonar.projectKey=HerlanCh_PlataformaGIS
sonar.organization=herlanch

# `packages/testing` es utilería de pruebas: se analiza como código de prueba.
sonar.sources=apps,packages
sonar.tests=apps,packages,tools/architecture
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/tests/**,packages/testing/**
sonar.exclusions=**/dist/**,**/coverage/**,**/*.generated.ts,tools/architecture/fixtures/**
sonar.coverage.exclusions=**/*.test.ts,**/*.test.tsx,**/tests/**,packages/testing/**,**/*.config.ts,**/src/main.ts,**/src/main.tsx,**/src/migrate.ts,**/rendimiento/cargar-reportes.ts,**/rendimiento/medir-consultas.ts,**/openapi/generar.ts,**/schema.ts
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# La compuerta de calidad bloquea el pipeline si no se supera.
sonar.qualitygate.wait=true

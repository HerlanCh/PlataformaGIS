name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  calidad:
    name: Compuertas de calidad
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          # SonarCloud necesita el historial completo para atribuir el código nuevo.
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # Cada compuerta se ejecuta aunque otra falle, para ver todos los incumplimientos de una vez.
      - name: Instalar
        run: pnpm install --frozen-lockfile
      - name: Lint (RNF-02)
        run: pnpm lint
      - name: Typecheck
        if: ${{ !cancelled() }}
        run: pnpm typecheck
      - name: Reglas de arquitectura (RNF-01)
        if: ${{ !cancelled() }}
        run: pnpm depcruise
      - name: Duplicación (RNF-03)
        if: ${{ !cancelled() }}
        run: pnpm duplication
      - name: Pruebas con cobertura (RNF-04)
        if: ${{ !cancelled() }}
        run: pnpm test
      - name: Build
        if: ${{ !cancelled() }}
        run: pnpm build
      - name: Arranque del bundle de la API
        if: ${{ !cancelled() }}
        run: node tools/arranque/api.mjs
      - name: Presupuesto — JS inicial < 250 KB comprimido (ISO 25010, eficiencia)
        if: ${{ !cancelled() }}
        run: node tools/presupuesto/js-inicial.mjs
      - name: Lighthouse — Performance y Accesibilidad ≥ 90
        if: ${{ !cancelled() }}
        run: pnpm exec lhci autorun
      - name: Informe de Lighthouse
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: informe-lighthouse
          path: .lighthouseci/
          include-hidden-files: true
          retention-days: 14
      - name: Auditoría de dependencias de producción (RNF-13)
        if: ${{ !cancelled() }}
        run: pnpm audit --prod --audit-level high
      - name: Auditoría de dependencias de desarrollo (informativa)
        run: pnpm audit --dev --audit-level high
        continue-on-error: true
      - name: SonarCloud
        # Se omite en PR de forks y de Dependabot, que no reciben el secreto.
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v8
